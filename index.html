<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bismith</title>
		<meta
			name="description"
			content="A procedural texture generator in the browser: pixel-art walls, floors and UI surfaces built from layers, path traced, and exported as PNG maps." />

		<link rel="canonical" href="%VITE_SITE_URL%" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Bismith" />
		<meta property="og:title" content="Bismith — procedural texture generator" />
		<meta
			property="og:description"
			content="Pixel-art walls, floors and UI surfaces built from layers, path traced, and exported as PNG maps." />
		<meta property="og:url" content="%VITE_SITE_URL%" />
		<meta property="og:image" content="%VITE_SITE_URL%logo.png" />
		<meta property="og:image:width" content="416" />
		<meta property="og:image:height" content="416" />
		<meta property="og:image:alt" content="The Bismith logo" />
		<meta name="twitter:card" content="summary" />
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
